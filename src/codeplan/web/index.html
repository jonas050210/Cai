<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodePlan-LM</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <h1>CodePlan<span>-LM</span></h1>
    <div class="field">
      <label for="model">Checkpoint</label>
      <select id="model"></select>
      <button id="load" class="ghost">laden</button>
    </div>
    <div class="field">
      <label for="system">System</label>
      <textarea id="system" rows="3">Antworte auf Deutsch oder Englisch. Fokus: Coding und Planung.</textarea>
    </div>
    <div class="field">
      <label for="temperature">temperature <output id="temperature-out">0.7</output></label>
      <input id="temperature" type="range" min="0" max="1.5" step="0.05" value="0.7">
    </div>
    <div class="field">
      <label for="top-k">top_k <output id="top-k-out">50</output></label>
      <input id="top-k" type="range" min="0" max="200" step="5" value="50">
    </div>
    <div class="field">
      <label for="top-p">top_p <output id="top-p-out">0.95</output></label>
      <input id="top-p" type="range" min="0.1" max="1" step="0.01" value="0.95">
    </div>
    <div class="field">
      <label for="max-tokens">max_tokens <output id="max-tokens-out">256</output></label>
      <input id="max-tokens" type="range" min="16" max="1024" step="16" value="256">
    </div>
    <div class="actions">
      <button id="new" class="ghost">Neues Gespräch</button>
      <button id="export" class="ghost">Export .md</button>
    </div>
    <p class="hint">Enter sendet, Shift+Enter macht eine neue Zeile.</p>
  </aside>

  <main id="main">
    <header>
      <span id="status" class="status">verbinde …</span>
      <span id="stats" class="stats"></span>
    </header>
    <section id="messages" aria-live="polite"></section>
    <form id="composer">
      <textarea id="input" rows="1" placeholder="Frage oder Code …"></textarea>
      <button id="send" type="submit">Senden</button>
      <button id="stop" type="button" class="ghost" hidden>Stop</button>
    </form>
  </main>
</div>
<script src="/static/app.js"></script>
</body>
</html>
