[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeplan-lm"
version = "0.1.0"
description = "From-scratch German/English coding and planning language model experiment"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "torch>=2.4",
  "tokenizers>=0.19",
  "numpy>=1.26",
  "tqdm>=4.66",
  "langdetect>=1.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
codeplan-ingest = "codeplan.ingest:main"
codeplan-prepare = "codeplan.prepare:main"
codeplan-tokenizer = "codeplan.tokenizer_train:main"
codeplan-pack = "codeplan.pack:main"
codeplan-pretrain = "codeplan.pretrain:main"
codeplan-sft = "codeplan.sft:main"
codeplan-generate = "codeplan.generate:main"
codeplan-chat = "codeplan.chat:main"
codeplan-eval = "codeplan.eval:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
