[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codeplan-lm"
version = "0.1.0"
description = "From-scratch German/English coding and planning language model experiment"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "torch>=2.4",
  "tokenizers>=0.19",
  "numpy>=1.26",
  "tqdm>=4.66",
  "langdetect>=1.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "safetensors>=0.4"]
serve = ["fastapi>=0.110", "uvicorn>=0.29", "safetensors>=0.4"]

[project.scripts]
codeplan-ingest = "codeplan.ingest:main"
codeplan-prepare = "codeplan.prepare:main"
codeplan-tokenizer = "codeplan.tokenizer_train:main"
codeplan-pack = "codeplan.pack:main"
codeplan-pretrain = "codeplan.pretrain:main"
codeplan-sft = "codeplan.sft:main"
codeplan-sft-data = "codeplan.sft_data:main"
codeplan-generate = "codeplan.generate:main"
codeplan-chat = "codeplan.chat:main"
codeplan-eval = "codeplan.eval:main"
codeplan-collect = "codeplan.collect:main"
codeplan-stats = "codeplan.stats:main"
codeplan-doctor = "codeplan.doctor:main"
codeplan-fertility = "codeplan.tokenizer_eval:main"
codeplan-bench = "codeplan.bench:main"
codeplan-export = "codeplan.export:main"
codeplan-serve = "codeplan.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
